global:
  scrape_interval: 5s

remote_write:
  - url: http://prometheus:9090/api/v1/write

scrape_configs:
  - job_name: 'springboot-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']

  - job_name: 'k6'
    static_configs:
      - targets: ['pushgateway:9091']
